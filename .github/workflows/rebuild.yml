name: Build and deploy

# Pulls the latest solutions from the leetcode dump, rebuilds the page, and
# publishes it to GitHub Pages. Nothing generated is committed to the repo.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone the solution dump
        run: git clone --quiet https://github.com/Proga97/leetcode_dump.git .cache/leetcode_dump
      - name: Parse problems
        run: python3 scripts/build_problems.py .cache/leetcode_dump
      - name: Build site
        run: python3 scripts/build_app.py
      - name: Report deck size
        run: python3 -c "import json;d=json.load(open('data/problems.json'));print(len(d),'problems')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
